services:
  postgres:
    image: paradedb/paradedb:pg18@sha256:8b96369912d4d5611756383df8a7d87d4561750ceb4a12df606ec55e21194b18
    container_name: deep-agents-rag-postgres
    restart: unless-stopped
    # Keep ParadeDB's required preload entries enabled explicitly.
    command:
      [
        "postgres",
        "-c",
        "shared_preload_libraries=pg_search,pg_cron,pg_stat_statements",
      ]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deep_agents_rag
    volumes:
      - postgres_data:/var/lib/postgresql
      # Do not mask ParadeDB's bundled 10_bootstrap_paradedb.sh script.
      - ./infra/db/init/20-extensions.sql:/docker-entrypoint-initdb.d/20-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deep_agents_rag"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
