services:
  postgres:
    build:
      context: .
      dockerfile: infra/db/Dockerfile
      args:
        PG_SEARCH_VERSION: "0.25.9"
    image: deep-agents-rag-postgres:pg17-pg-search-0.25.9
    container_name: deep-agents-rag-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deep_agents_rag
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deep_agents_rag"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
